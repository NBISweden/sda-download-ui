name: sda-download-ui

services:

  frontend:
    image: ghcr.io/nbisweden/sda-download-ui:${TAG:-latest}
    build:
      context: ./frontend
      dockerfile: ../Dockerfile
      target: prod
      args:
        BUILD_ID: "${BUILD_ID:-6000:6000}"
        RUNTIME_ID: "${RUNTIME_ID:-6001:6001}"
        BUILD_GIT_COMMIT: "${BUILD_GIT_COMMIT:-}"
        BUILD_GIT_BRANCH: "${BUILD_GIT_BRANCH:-}"
    healthcheck:
      test: ["CMD", "sh", "-c", 'wget -q --spider "http://$$HOSTNAME:3000/"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - 127.0.0.1:3002:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"

    read_only: true             # similar to readOnlyRootFilesystem
    security_opt:
      - no-new-privileges:true  # like allowPrivilegeEscalation: false
    cap_drop:
      - ALL                     # like capabilities.drop: ["ALL"]
    tmpfs:
      - /tmp                    # provide a writable tmpfs for runtime needs
    volumes:
      - ./sdad-config.json:/app/sdad-config.json:ro
    secrets:
      - frontend-oidc-client-secret
      - frontend-oidc-client-id
      - frontend-next-auth-secret

secrets:
  frontend-oidc-client-secret:
    file: ./secrets/frontend-oidc-client-secret.txt
  frontend-oidc-client-id:
    file: ./secrets/frontend-oidc-client-id.txt
  frontend-next-auth-secret:
    file: ./secrets/frontend-next-auth-secret.txt
