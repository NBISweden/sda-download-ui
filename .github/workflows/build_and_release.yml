name: Docker Build and Push

on:
  push:
    branches:
      - main
      - develop

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Skip when a sync-back PR from main is merged into develop
    if: |
      !(
        github.ref == 'refs/heads/develop' &&
        contains(github.event.head_commit.message, 'chore: sync v') &&
        contains(github.event.head_commit.message, 'back to develop')
      )
    permissions:
      contents: write
      packages: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Version handling (release-only, i.e., when on main)
      - name: Read version from package.json
        if: github.ref == 'refs/heads/main'
        id: version
        run: |
          VERSION=$(jq -r .version frontend/package.json)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=v$VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag already exists
        if: github.ref == 'refs/heads/main'
        id: check
        run: |
          if git rev-parse "${{ steps.version.outputs.TAG }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.version.outputs.TAG }} already exists — skipping release"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Create git tag
        if: github.ref == 'refs/heads/main' && steps.check.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.TAG }}" -m "Release ${{ steps.version.outputs.TAG }}"
          git push origin "${{ steps.version.outputs.TAG }}"

      # Image build (runs for both develop and main)
      - name: Skip build if release skipped
        id: should_build
        run: |
          # Build on develop always. On main, only if not skipped.
          if [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            echo "build=true" >> $GITHUB_OUTPUT
          elif [ "${{ steps.check.outputs.skip }}" = "false" ]; then
            echo "build=true" >> $GITHUB_OUTPUT
          else
            echo "build=false" >> $GITHUB_OUTPUT
          fi

      - name: Log in to the Container registry
        if: steps.should_build.outputs.build == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get short SHA
        if: steps.should_build.outputs.build == 'true'
        id: sha
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >>$GITHUB_OUTPUT

      - name: Get date tag
        if: steps.should_build.outputs.build == 'true'
        id: date
        run: echo "DATE_TAG=$(date +%Y%m%d-%H%M)" >>$GITHUB_OUTPUT

      - name: Get PR number (develop only)
        if: steps.should_build.outputs.build == 'true' && github.ref == 'refs/heads/develop'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(gh api "/repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].number // empty')
          if [ -n "$PR_NUMBER" ]; then
            echo "PR_TAG=PR$PR_NUMBER" >> $GITHUB_OUTPUT
            echo "Found PR #$PR_NUMBER"
          else
            echo "No PR found for commit ${{ github.sha }}"
            echo "PR_TAG=" >> $GITHUB_OUTPUT
          fi

      - name: Extract metadata
        if: steps.should_build.outputs.build == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}},value=${{ steps.version.outputs.TAG }},enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.TAG }},enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.TAG }},enable=${{ github.ref == 'refs/heads/main' }}
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.date.outputs.DATE_TAG }}
            type=raw,value=${{ steps.pr.outputs.PR_TAG }},enable=${{ steps.pr.outputs.PR_TAG != '' }}

      - name: Build and push
        if: steps.should_build.outputs.build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ../Dockerfile
          target: prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_ID=6000:6000
            RUNTIME_ID=6001:6001
            BUILD_GIT_COMMIT=${{ steps.sha.outputs.SHORT_SHA }}
            BUILD_GIT_BRANCH=${{ github.ref_name }}

      # Release-only steps (main branch)
      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && steps.check.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: ${{ steps.version.outputs.TAG }}
          generate_release_notes: true

      - name: Open sync-back PR to develop
        if: github.ref == 'refs/heads/main' && steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="sync/main-to-develop-${{ steps.version.outputs.VERSION }}"
          git checkout -b "$BRANCH"
          git push origin "$BRANCH"
          gh pr create \
            --base develop \
            --head "$BRANCH" \
            --title "chore: sync ${{ steps.version.outputs.TAG }} back to develop" \
            --body "Automated sync of \`main\` back into \`develop\` after release **${{ steps.version.outputs.TAG }}**."
